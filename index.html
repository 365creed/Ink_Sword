<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>묵검 (墨劍) - 수묵 액션</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="app-container">
    <div class="top-nav">
      <button id="skip-btn" class="ink-btn" style="color: #8a2420;">건너뛰기 ➔ (ESC)</button>
      <button id="clear-cache-btn" class="ink-btn">캐시 비우기</button>
      <button id="fullscreen-btn" class="ink-btn">전체화면</button>
    </div>

    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div class="mobile-controls">
      <div class="touch-group">
        <button id="m-left" class="stamp-btn sub">◀</button>
        <button id="m-right" class="stamp-btn sub">▶</button>
        <button id="m-jump" class="stamp-btn sub">躍<span>도약</span></button>
      </div>
      <div class="touch-group">
        <button id="m-dash" class="stamp-btn sub">迅<span class="cost">-15</span></button>
        <button id="m-parry" class="stamp-btn sub">返<span class="cost">패링</span></button>
        <button id="m-heavy" class="stamp-btn">破<span class="cost">-20</span></button>
        <button id="m-atk" class="stamp-btn">斬<span class="cost">기본</span></button>
        <button id="m-sp" class="stamp-btn" style="background:#1a1714; border-color:#8a2020;">墨<span class="cost">100</span></button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>

  <script>
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    });

    document.getElementById('clear-cache-btn').addEventListener('click', async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) await reg.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        window.location.href = window.location.origin + window.location.pathname + '?t=' + Date.now();
      } catch (e) {
        window.location.reload();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
          reg.update();
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        } catch (err) {}
      });
    }
  </script>
</body>
</html>
