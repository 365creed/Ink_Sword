<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>묵검 (墨劍) - 수묵 액션</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="app-container">
    <div class="top-nav">
      <button id="clear-cache-btn" class="ink-btn" style="color: #a82424; font-weight: bold;">캐시 비우기 & 새로고침</button>
      <button id="save-status-btn" class="ink-btn">기기 저장됨</button>
      <button id="fullscreen-btn" class="ink-btn">전체화면</button>
    </div>

    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <!-- 모바일 전용 수묵 도장 패드 -->
    <div class="mobile-controls">
      <div class="touch-group">
        <button id="m-left" class="stamp-btn sub">◀</button>
        <button id="m-right" class="stamp-btn sub">▶</button>
        <button id="m-jump" class="stamp-btn sub">躍<span>도약</span></button>
      </div>
      <div class="touch-group">
        <button id="m-dash" class="stamp-btn sub">迅<span class="cost">-15</span></button>
        <button id="m-parry" class="stamp-btn sub">返<span class="cost">패링</span></button>
        <button id="m-heavy" class="stamp-btn">破<span class="cost">-20</span></button>
        <button id="m-atk" class="stamp-btn">斬<span class="cost">기본</span></button>
        <button id="m-sp" class="stamp-btn" style="background:#1a1714; border-color:#8a2020;">墨<span class="cost">100</span></button>
      </div>
    </div>
  </div>

  <!-- 메인 게임 스크립트 -->
  <script type="module" src="main.js"></script>

  <!-- PWA 자동 갱신 및 유틸리티 통합 스크립트 -->
  <script>
    // 1. 전체화면 토글
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    });

    // 2. 캐시 비우기 & 강제 새로고침 버튼 동작
    document.getElementById('clear-cache-btn').addEventListener('click', async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        // 캐시를 타지 않도록 파라미터를 붙여 완전 새로고침
        window.location.href = window.location.origin + window.location.pathname + '?t=' + Date.now();
      } catch (err) {
        console.error('캐시 초기화 에러:', err);
        window.location.reload();
      }
    });

    // 3. 서비스 워커 자동 감지 및 갱신 (버전 번호 관리 불필요)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js', {
            updateViaCache: 'none' // sw.js 브라우저 자체 캐싱 원천 차단
          });

          // 접속할 때마다 서버의 변경사항 즉시 체크
          reg.update();

          // 새 코드가 배포되어 활성화되면 자동으로 화면 리로드
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        } catch (err) {
          console.error('PWA 등록 실패:', err);
        }
      });
    }
  </script>
</body>
</html>
